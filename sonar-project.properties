# Fleet Sonar config. This file is HALF OF A PAIR:
#   1. Create the project at https://sonar.ttgteams.com with EXACTLY this key.
#   2. The key must match `sonar-project-key` in .github/workflows/janus.yml
#      and sonar-main.yml — keep all three identical.
sonar.projectKey=learning-app
sonar.projectName=learning-app

# EDIT the paths below only if your layout isn't backend/src + frontend/src.
sonar.sources=backend/src,frontend/src
sonar.tests=backend/tests,frontend/tests
# What counts as a test file — house convention, do not change.
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

# Files Sonar skips entirely.
# EDIT: the two entrypoint filenames (server.ts / main.tsx) to match yours.
sonar.exclusions=**/*.test.*,**/__tests__/**,backend/src/test/**,**/node_modules/**,**/build/**,**/dist/**,backend/src/index.ts,frontend/src/index.tsx,frontend/src/vite-env.d.ts,**/*.d.ts

# Analyzed but exempt from the coverage requirement (bootstrap/entrypoint code).
# EDIT: same entrypoint names as above. KEEP IN SYNC with the coverage.exclude
# list in vitest.config.ts — if they drift, Gate 7 demands coverage on files
# vitest was told to skip.
sonar.coverage.exclusions=backend/src/index.ts,backend/src/test/**,frontend/src/index.tsx,**/*.d.ts

# Where vitest writes coverage — do not change.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
