version: 2

# TTG Technology Standards §3.11.1: Dependabot alerts enabled on all
# repositories, with automated update pull requests reviewed and merged
# promptly. Grouping keeps that reviewable — one PR a week per ecosystem for
# routine updates, and separate immediate PRs for anything security-related.

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Edmonton
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      # Matches the commit convention in §1.9.
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      dev-tooling:
        patterns: ['eslint*', 'prettier*', '@typescript-eslint/*', 'typescript']
        update-types: [minor, patch]
      root-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Edmonton
    open-pull-requests-limit: 5
    labels: [dependencies, backend]
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      # Prisma's client, CLI and adapter must move together or the build breaks.
      prisma:
        patterns: ['prisma', '@prisma/*']
      testing:
        patterns: ['jest', 'ts-jest', '@types/jest', 'supertest', '@types/supertest']
      backend-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Edmonton
    open-pull-requests-limit: 5
    labels: [dependencies, frontend]
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      # React and its types are a single upgrade decision.
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      testing:
        patterns: ['jest*', 'ts-jest', '@testing-library/*', '@playwright/*']
      frontend-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]

  # The Dockerfiles pin base images, which age out of support like any other
  # dependency and are easy to forget because nothing installs them.
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    labels: [dependencies, docker]

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    labels: [dependencies, docker]

  # Pinned action versions are a supply-chain surface of their own.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, ci]
