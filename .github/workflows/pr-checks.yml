name: PR Checks

# Every gate TTG Technology Standards §1.1.4 and §5.1.2 require before a merge:
# lint, type checks, build verification, unit tests and end-to-end tests.
#
# Runs on pull requests and on pushes to the protected branches, so that a merge
# re-runs everything rather than trusting the last PR run against a stale base.

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

# A newer push supersedes an in-flight run for the same ref; there is no value
# in finishing a check against code that has already been replaced.
concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      - name: Install workspace dependencies
        run: |
          npm ci --no-audit --no-fund --prefix backend
          npm ci --no-audit --no-fund --prefix frontend

      # §5.1.2: "Fail on warnings or errors".
      - name: ESLint
        run: npx eslint . --max-warnings=0

      - name: Prettier formatting
        run: npx prettier --check "**/*.+(js|ts|tsx|json)"

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund --prefix backend
          npm ci --no-audit --no-fund --prefix frontend

      # Prisma's generated client is a compile-time dependency of the backend,
      # so it has to exist before tsc runs. No database is needed to generate it.
      - name: Generate Prisma client
        run: npm run prisma:generate --prefix backend

      - name: Backend types (src, scripts and prisma)
        run: npm run typecheck --prefix backend

      - name: Frontend types
        run: npm run typecheck --prefix frontend

  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest

    # Integration and database tests need a real PostgreSQL, per §5.5.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: learning_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d learning_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/learning_test?schema=public
      NODE_ENV: test
      # A throwaway key: auth middleware refuses to load without one, and the
      # tests that exercise it supply their own signed tokens.
      PUBLICKEY: ${{ secrets.TEST_PUBLICKEY || 'MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAtest' }}
      LOG_LEVEL: silent

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --prefix backend

      - name: Apply migrations
        run: npm run db:setup --prefix backend

      # §5.1.2: enforce coverage thresholds and fail on any test error.
      - name: Unit and integration tests
        run: npm run test:coverage --prefix backend

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

  test-frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --prefix frontend

      - name: Unit and component tests
        run: npm run test:coverage --prefix frontend

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

  build:
    name: Build verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund --prefix backend
          npm ci --no-audit --no-fund --prefix frontend

      - name: Generate Prisma client
        run: npm run prisma:generate --prefix backend

      - name: Build backend
        run: npm run build --prefix backend

      - name: Build frontend
        run: npm run build --prefix frontend

      # §5.1.2 asks build verification to confirm artifact generation.
      - name: Confirm artifacts exist
        run: |
          test -f backend/build/src/index.js || { echo "backend artifact missing"; exit 1; }
          test -f frontend/dist/index.html || { echo "frontend artifact missing"; exit 1; }
          echo "Artifacts present."

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    # E2E is the slowest gate, so it waits for the cheap ones to pass first.
    needs: [lint, typecheck, build]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: learning_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d learning_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/learning_e2e?schema=public
      NODE_ENV: test
      PUBLICKEY: ${{ secrets.TEST_PUBLICKEY || 'MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAtest' }}
      LOG_LEVEL: silent

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund --prefix backend
          npm ci --no-audit --no-fund --prefix frontend

      - name: Apply migrations
        run: npm run db:setup --prefix backend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run end-to-end tests
        run: npm run test:e2e --prefix frontend

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
