name: Security

# TTG Technology Standards §3.11.2 (static analysis reported back to the pull
# request) and §3.10.2 (dependency checking and a Software Bill of Materials).

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  schedule:
    # Weekly, so a newly disclosed vulnerability in unchanged code is still
    # found. Static analysis only on change would never catch those.
    - cron: '0 5 * * 1'
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest

    permissions:
      # Required to upload results to the Security tab and annotate the PR.
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - uses: actions/checkout@v4

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # security-and-quality adds maintainability rules on top of the
          # default security pack.
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analyse
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # §3.10.2: "all components are up to date, preferably using a dependency
      # checker during build or compile time".
      #
      # `--audit-level=high` is the gate rather than `low`: a build that fails
      # on every advisory in a transitive dev dependency gets ignored, and an
      # ignored gate protects nothing.
      - name: Audit root
        run: npm audit --audit-level=high
        continue-on-error: false

      - name: Audit backend
        run: npm audit --audit-level=high --prefix backend

      - name: Audit frontend
        run: npm audit --audit-level=high --prefix frontend

  sbom:
    name: Software Bill of Materials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund --prefix backend
          npm ci --no-audit --no-fund --prefix frontend

      # §3.10.2: "a Software Bill of Materials (SBOM) is maintained for all
      # third-party libraries in use". CycloneDX is the format the tooling in
      # the wider ecosystem reads.
      - name: Generate backend SBOM
        run: npx --yes @cyclonedx/cyclonedx-npm@latest
          --output-format JSON
          --output-file sbom-backend.json
          --package-lock-only
          backend/package.json

      - name: Generate frontend SBOM
        run: npx --yes @cyclonedx/cyclonedx-npm@latest
          --output-format JSON
          --output-file sbom-frontend.json
          --package-lock-only
          frontend/package.json

      - name: Publish SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom-backend.json
            sbom-frontend.json
          retention-days: 90
