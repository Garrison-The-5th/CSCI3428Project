# TEMPLATE — edits required: 1 (app-dir). Must match this app's directory in
# k8s-gitops (apps/<name>) — that's where the staging image tag gets bumped.
#
# Deploy to Staging — thin wrapper. Builds every image in ./docker-bake.hcl,
# pushes to Docker Hub, bumps apps/<name>/staging/kustomization.yaml.
# A plain merge does NOT deploy: only commits whose message contains
# #patch / #minor / #major, or a manual dispatch with a bump choice.
name: Deploy to Staging

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  deploy:
    uses: TTGteams/k8s-gitops/.github/workflows/reusable-deploy-staging.yml@main
    with:
      app-dir: apps/learning-app      # EDIT: this app's folder in k8s-gitops
      bump: ${{ inputs.bump || 'auto' }}
    secrets: inherit
