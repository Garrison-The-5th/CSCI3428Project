server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 100M;

    # SPA fallback: this app uses react-router-dom's BrowserRouter, so any
    # path that isn't a real static file must resolve to index.html and let
    # the client-side router take over.
    # Security headers for every page. The Content Security Policy itself is a
    # meta tag written into index.html at build time (see vite.config.ts) — it
    # depends on which Keycloak the build points at — except for
    # frame-ancestors, which only works as a header: nobody may put this app in
    # a frame on their own site and trick a user into clicking through it.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html names the current build's hashed files, so it must never be
    # cached: a stale copy asks for CSS and JS that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Hashed build output: a missing file is a 404, never the SPA fallback.
    # Falling back served index.html as text/html under a .css or .js URL;
    # nosniff made the browser drop it, so the page rendered unstyled, and
    # Cloudflare cached that response for hours. Present files never change
    # (the hash is in the name), so they can be cached for good.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
